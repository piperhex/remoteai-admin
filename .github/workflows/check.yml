name: Admin backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: test -z "$(gofmt -l .)"
      - run: npm run check
      - run: go test ./internal/server -run TestKong -count=1
      - name: Verify Compose and relay deployment guards
        env:
          COMPOSE_CONFIG_TEST: '1'
        run: python3 -B -m unittest discover -s scripts -p 'test_deployment_*.py' -v
      - name: Race tests with Redis
        run: |
          docker run --detach --rm --name admin-test-redis -p 127.0.0.1:16389:6379 redis:7-alpine
          TELEMETRY_TEST_REDIS=127.0.0.1:16389 UPDATE_PEER_TEST_REDIS=127.0.0.1:16389 go test -race ./...
